version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8 only accepts typescript <6.1, and TypeScript 7 changes the
      # compiler that emits the published JS: move to it on purpose, not in a dev bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
